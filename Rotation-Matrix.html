<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旋转矩阵</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --surface: #f2f3f5;
  --surface-hover: #e9ecf0;
  --line: #e4e6eb;
  --line-strong: #cbd0d9;
  --track: #dfe2e8;
  --ink: #16181d;
  --ink-2: #646b78;
  --ink-3: #8e95a3;
  --x: #d63d2e;
  --y: #1f8a4c;
  --z: #2264c4;
  --v0: #8b93a1;
  --vf: #16181d;
  --accent: #16181d;
  --accent-ink: #ffffff;
  --bracket: #4a5160;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121418;
    --panel: #171a20;
    --surface: #20242c;
    --surface-hover: #272c36;
    --line: #272b35;
    --line-strong: #3a404f;
    --track: #2e333f;
    --ink: #eceef2;
    --ink-2: #8d95a5;
    --ink-3: #626a7a;
    --x: #e66558;
    --y: #45b572;
    --z: #5798ec;
    --v0: #747d8e;
    --vf: #f2f4f8;
    --accent: #eceef2;
    --accent-ink: #121418;
    --bracket: #9aa3b2;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.4;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

sub {
  font-size: 0.72em;
  line-height: 0;
  vertical-align: -0.22em;
}

#app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  height: 100%;
  height: 100dvh;
}

#stage {
  position: relative;
  background: var(--bg);
  overflow: hidden;
}

#canvasHost {
  position: absolute;
  inset: 0;
  cursor: grab;
  touch-action: none;
}

#canvasHost:active {
  cursor: grabbing;
}

#canvasHost canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.legend {
  position: absolute;
  left: 16px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0;
  padding: 0;
  list-style: none;
  pointer-events: none;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
}

.legend li {
  display: flex;
  align-items: center;
  gap: 6px;
  transition: opacity 0.15s ease;
}

.legend li.hidden {
  opacity: 0.25;
}

.legend-mark {
  display: inline-block;
  width: 14px;
  height: 0;
  border-top: 2px solid currentColor;
}

.legend-mark.dashed {
  border-top-style: dashed;
  border-top-width: 1.5px;
}

.legend-mark.final {
  border-top-width: 2.5px;
}

#rail {
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
}

#rail::-webkit-scrollbar {
  width: 6px;
}

#rail::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 3px;
}

.rail-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.rail-head h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.rail-formula {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink-2);
  white-space: nowrap;
}

.section {
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.section:last-child {
  border-bottom: none;
  padding-bottom: 4px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 11px;
}

.section-head h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  letter-spacing: 0.01em;
}

/* Vector inputs */
.vec-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.vec-field {
  --c: var(--ink-2);
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 9px;
  height: 32px;
  background: var(--surface);
  border: 1px solid transparent;
  border-radius: 5px;
  transition: border-color 0.12s ease, background-color 0.12s ease;
}

.vec-field:hover {
  border-color: var(--line-strong);
}

.vec-field:focus-within {
  background: var(--panel);
  border-color: var(--c);
}

.vec-axis {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--c);
  user-select: none;
}

.vec-field input {
  width: 100%;
  min-width: 0;
  border: none;
  background: transparent;
  color: var(--ink);
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  padding: 0;
  outline: none;
}

.vec-field input::-webkit-outer-spin-button,
.vec-field input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.vec-field input[type="number"] {
  -moz-appearance: textfield;
}

/* Angle sliders */
.ang-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ang-row {
  --c: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}

.ang-label {
  width: 24px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--c);
  flex: none;
}

.slider-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 20px;
  display: flex;
  align-items: center;
}

.slider-wrap::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1px;
  height: 8px;
  background: var(--line-strong);
  transform: translate(-0.5px, -50%);
  pointer-events: none;
  z-index: 0;
}

.slider-wrap input[type="range"] {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0;
  height: 3px;
  border-radius: 2px;
  appearance: none;
  -webkit-appearance: none;
  outline: none;
  cursor: pointer;
  background: linear-gradient(
    to right,
    var(--track) 0%,
    var(--track) var(--fill-start, 50%),
    var(--c) var(--fill-start, 50%),
    var(--c) var(--fill-end, 50%),
    var(--track) var(--fill-end, 50%),
    var(--track) 100%
  );
}

.slider-wrap input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--c);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
  cursor: pointer;
  transition: transform 0.1s ease;
}

.slider-wrap input[type="range"]::-webkit-slider-thumb:hover {
  transform: scale(1.12);
}

.slider-wrap input[type="range"]::-moz-range-track {
  background: transparent;
  border: none;
}

.slider-wrap input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--panel);
  border: 2px solid var(--c);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
  cursor: pointer;
}

.ang-val {
  width: 48px;
  flex: none;
  text-align: right;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--ink);
  cursor: text;
  padding: 2px 3px;
  border-radius: 4px;
  transition: background-color 0.12s ease;
}

.ang-val:hover {
  background: var(--surface);
}

.ang-val input {
  width: 100%;
  text-align: right;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--c);
  border-radius: 3px;
  padding: 1px 3px;
  outline: none;
  -moz-appearance: textfield;
  appearance: textfield;
}

.ang-val input::-webkit-outer-spin-button,
.ang-val input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.ang-controls {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.chk-row {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  user-select: none;
  width: fit-content;
}

.chk-row input {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  margin: 0;
  border: 1.5px solid var(--line-strong);
  border-radius: 3px;
  background: var(--panel);
  position: relative;
  cursor: pointer;
  flex: none;
}

.chk-row input:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.chk-row input:checked::after {
  content: "";
  position: absolute;
  left: 3.5px;
  top: 0.5px;
  width: 4px;
  height: 7.5px;
  border: solid var(--accent-ink);
  border-width: 0 1.8px 1.8px 0;
  transform: rotate(45deg);
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.btn {
  height: 31px;
  padding: 0 12px;
  border-radius: 5px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}

.btn:hover {
  background: var(--surface);
}

.btn.primary {
  background: var(--surface);
  border-color: var(--line-strong);
}

.btn.primary:hover {
  background: var(--surface-hover);
}

.btn.primary.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
}

/* Transform steps */
.steps-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.step-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}

.step-expr {
  color: var(--ink-2);
  white-space: nowrap;
}

.step-val {
  color: var(--ink-2);
  font-weight: 400;
  text-align: right;
  white-space: nowrap;
}

.step-row.final {
  margin-top: 3px;
  padding-top: 7px;
  border-top: 1px dashed var(--line);
}

.step-row.final .step-expr {
  color: var(--ink);
  font-weight: 600;
}

.step-row.final .step-val {
  color: var(--ink);
  font-weight: 600;
}

/* Segmented toggle */
.seg {
  display: inline-flex;
  padding: 2px;
  background: var(--surface);
  border-radius: 5px;
  border: 1px solid var(--line);
}

.seg button {
  border: none;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 3px;
  cursor: pointer;
  transition: background-color 0.12s ease, color 0.12s ease;
}

.seg button.active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
}

/* Matrices */
.matrices-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.matrix-block {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.matrix-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.matrix-name {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
}

.matrix-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex: none;
}

.matrix-angle {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 11.5px;
  color: var(--ink-3);
}

.matbox {
  display: inline-flex;
  align-items: stretch;
  width: fit-content;
  max-width: 100%;
}

.bracket {
  width: 5px;
  border-top: 1.25px solid var(--bracket);
  border-bottom: 1.25px solid var(--bracket);
}

.bracket.l {
  border-left: 1.25px solid var(--bracket);
}

.bracket.r {
  border-right: 1.25px solid var(--bracket);
}

.matgrid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, auto));
  gap: 3px 16px;
  padding: 5px 10px;
}

.matgrid span {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  line-height: 1.45;
  white-space: nowrap;
}

.matgrid.symbolic span {
  text-align: center;
  min-width: 4.5em;
}

.matgrid.numeric span {
  text-align: right;
  min-width: 3.9em;
}

@media (max-width: 860px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 45% minmax(0, 1fr);
  }
  #rail {
    border-left: none;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
}
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="canvasHost"></div>
    <ul class="legend" aria-hidden="true">
      <li><i class="legend-mark dashed" style="color:var(--v0)"></i><span>v<sub>0</sub></span></li>
      <li id="legend-v1"><i class="legend-mark" style="color:var(--x)"></i><span>v<sub>1</sub></span></li>
      <li id="legend-v2"><i class="legend-mark" style="color:var(--y)"></i><span>v<sub>2</sub></span></li>
      <li><i class="legend-mark final" style="color:var(--vf)"></i><span>v′</span></li>
    </ul>
  </section>

  <aside id="rail">
    <header class="rail-head">
      <h1>旋转矩阵</h1>
      <span class="rail-formula">v′ = R<sub>z</sub>R<sub>y</sub>R<sub>x</sub>v</span>
    </header>

    <section class="section">
      <div class="section-head">
        <h2>向量 v</h2>
      </div>
      <div class="vec-grid">
        <label class="vec-field" style="--c:var(--x)">
          <span class="vec-axis">x</span>
          <input type="number" id="vx" value="2" step="0.1">
        </label>
        <label class="vec-field" style="--c:var(--y)">
          <span class="vec-axis">y</span>
          <input type="number" id="vy" value="1" step="0.1">
        </label>
        <label class="vec-field" style="--c:var(--z)">
          <span class="vec-axis">z</span>
          <input type="number" id="vz" value="1" step="0.1">
        </label>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>旋转角度</h2>
      </div>
      <div class="ang-list">
        <div class="ang-row" style="--c:var(--x)">
          <span class="ang-label">θ<sub>x</sub></span>
          <div class="slider-wrap">
            <input type="range" id="ax" min="-180" max="180" value="30" step="1" aria-label="绕 X 轴旋转角度">
          </div>
          <span class="ang-val" id="axv" tabindex="0" role="button">30°</span>
        </div>
        <div class="ang-row" style="--c:var(--y)">
          <span class="ang-label">θ<sub>y</sub></span>
          <div class="slider-wrap">
            <input type="range" id="ay" min="-180" max="180" value="45" step="1" aria-label="绕 Y 轴旋转角度">
          </div>
          <span class="ang-val" id="ayv" tabindex="0" role="button">45°</span>
        </div>
        <div class="ang-row" style="--c:var(--z)">
          <span class="ang-label">θ<sub>z</sub></span>
          <div class="slider-wrap">
            <input type="range" id="az" min="-180" max="180" value="60" step="1" aria-label="绕 Z 轴旋转角度">
          </div>
          <span class="ang-val" id="azv" tabindex="0" role="button">60°</span>
        </div>
      </div>

      <div class="ang-controls">
        <label class="chk-row">
          <input type="checkbox" id="showSteps" checked>
          <span>显示中间步骤</span>
        </label>
        <div class="btn-row">
          <button type="button" class="btn primary" id="animateBtn">播放序列</button>
          <button type="button" class="btn" id="resetBtn">重置</button>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>变换结果</h2>
      </div>
      <div class="steps-list" id="steps"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>旋转矩阵</h2>
        <div class="seg" id="matModeSeg">
          <button type="button" class="active" data-mode="symbolic">符号</button>
          <button type="button" data-mode="numeric">数值</button>
        </div>
      </div>
      <div class="matrices-list" id="matrices"></div>
    </section>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Theme & Palette ──────────────────────────────────────────────────────────
const PALETTES = {
  light: {
    bg: 0xf5f6f8,
    gridMajor: 0xd5dae2,
    gridMinor: 0xe7eaef,
    origin: 0x646b78,
    x: 0xd63d2e,
    y: 0x1f8a4c,
    z: 0x2264c4,
    v0: 0x8b93a1,
    vf: 0x16181d,
  },
  dark: {
    bg: 0x121418,
    gridMajor: 0x2b303b,
    gridMinor: 0x1d2129,
    origin: 0x8d95a5,
    x: 0xe66558,
    y: 0x45b572,
    z: 0x5798ec,
    v0: 0x747d8e,
    vf: 0xf2f4f8,
  }
};

const darkMql = window.matchMedia('(prefers-color-scheme: dark)');
let palette = darkMql.matches ? PALETTES.dark : PALETTES.light;
const hexStr = (n) => '#' + n.toString(16).padStart(6, '0');

// ── Pure Math ────────────────────────────────────────────────────────────────
const DEG2RAD = Math.PI / 180;
const AX = {
  X: new THREE.Vector3(1, 0, 0),
  Y: new THREE.Vector3(0, 1, 0),
  Z: new THREE.Vector3(0, 0, 1)
};

function rotX(t) {
  const c = Math.cos(t), s = Math.sin(t);
  return new THREE.Matrix3(1, 0, 0, 0, c, -s, 0, s, c);
}

function rotY(t) {
  const c = Math.cos(t), s = Math.sin(t);
  return new THREE.Matrix3(c, 0, s, 0, 1, 0, -s, 0, c);
}

function rotZ(t) {
  const c = Math.cos(t), s = Math.sin(t);
  return new THREE.Matrix3(c, -s, 0, s, c, 0, 0, 0, 1);
}

function compute(st) {
  const Rx = rotX(st.ax * DEG2RAD);
  const Ry = rotY(st.ay * DEG2RAD);
  const Rz = rotZ(st.az * DEG2RAD);
  const v0 = new THREE.Vector3(st.vx, st.vy, st.vz);
  const v1 = v0.clone().applyMatrix3(Rx);
  const v2 = v1.clone().applyMatrix3(Ry);
  const v3 = v2.clone().applyMatrix3(Rz);
  const R = new THREE.Matrix3().multiplyMatrices(Rz, Ry).multiply(Rx);
  return { vs: [v0, v1, v2, v3], R };
}

function fmtNum(n) {
  if (Math.abs(n) < 1e-10) return '0';
  if (Math.abs(n - 1) < 1e-10) return '1';
  if (Math.abs(n + 1) < 1e-10) return '−1';
  const val = Math.abs(n) < 5e-4 ? 0 : n;
  const s = val.toFixed(3);
  return s.startsWith('-') ? '−' + s.slice(1) : s;
}

function fmtCoord(n) {
  const val = Math.abs(n) < 5e-4 ? 0 : n;
  return val.toFixed(3);
}

function fmtDeg(n) {
  if (Math.abs(n) < 1e-6) return '0°';
  if (Number.isInteger(n)) return `${n}°`;
  const s = n.toFixed(1);
  return (s === '-0.0' ? '0.0' : s) + '°';
}

function matrixCells(axis, theta, symbolic) {
  const rad = theta * DEG2RAD;
  const c = Math.cos(rad);
  const s = Math.sin(rad);
  const sub = axis.toLowerCase();
  if (symbolic) {
    const cs = `cos θ<sub>${sub}</sub>`;
    const sn = `sin θ<sub>${sub}</sub>`;
    const ns = `−sin θ<sub>${sub}</sub>`;
    if (axis === 'X') return ['1', '0', '0', '0', cs, ns, '0', sn, cs];
    if (axis === 'Y') return [cs, '0', sn, '0', '1', '0', ns, '0', cs];
    return [cs, ns, '0', sn, cs, '0', '0', '0', '1'];
  }
  if (axis === 'X') return ['1', '0', '0', '0', fmtNum(c), fmtNum(-s), '0', fmtNum(s), fmtNum(c)];
  if (axis === 'Y') return [fmtNum(c), '0', fmtNum(s), '0', '1', '0', fmtNum(-s), '0', fmtNum(c)];
  return [fmtNum(c), fmtNum(-s), '0', fmtNum(s), fmtNum(c), '0', '0', '0', '1'];
}

// ── 3D Scene Controller ──────────────────────────────────────────────────────
const host = document.getElementById('canvasHost');
const scene = new THREE.Scene();
scene.background = new THREE.Color(palette.bg);
scene.fog = new THREE.Fog(palette.bg, 22, 60);

const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 1000);
camera.position.set(8.2, 5.8, 10.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
host.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 30;

scene.add(new THREE.HemisphereLight(0xffffff, 0x80848c, 1.35));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(8, 12, 10);
scene.add(dirLight);

const AXIS_LEN = 5;
const UP = new THREE.Vector3(0, 1, 0);

function orientAlong(obj, dir) {
  if (dir.y < -0.99999) {
    obj.quaternion.setFromAxisAngle(AX.X, Math.PI);
  } else {
    obj.quaternion.setFromUnitVectors(UP, dir);
  }
}

function makeAxis(color, dir) {
  const g = new THREE.Group();
  const posMat = new THREE.LineBasicMaterial({ color });
  const posLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      dir.clone().multiplyScalar(AXIS_LEN - 0.16)
    ]),
    posMat
  );
  g.add(posLine);

  const negMat = new THREE.LineDashedMaterial({
    color,
    dashSize: 0.16,
    gapSize: 0.14,
    transparent: true,
    opacity: 0.28
  });
  const negLine = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      dir.clone().multiplyScalar(-AXIS_LEN)
    ]),
    negMat
  );
  negLine.computeLineDistances();
  g.add(negLine);

  const coneMat = new THREE.MeshBasicMaterial({ color });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.052, 0.19, 16), coneMat);
  cone.position.copy(dir).multiplyScalar(AXIS_LEN - 0.095);
  orientAlong(cone, dir);
  g.add(cone);

  g.userData.materials = [posMat, negMat, coneMat];
  return g;
}

const axisGroups = {
  x: makeAxis(palette.x, AX.X),
  y: makeAxis(palette.y, AX.Y),
  z: makeAxis(palette.z, AX.Z)
};
scene.add(axisGroups.x, axisGroups.y, axisGroups.z);

let grid = null;
function rebuildGrid() {
  if (grid) {
    scene.remove(grid);
    grid.geometry.dispose();
    if (Array.isArray(grid.material)) {
      grid.material.forEach((m) => m.dispose());
    } else {
      grid.material.dispose();
    }
  }
  grid = new THREE.GridHelper(AXIS_LEN * 2, 20, palette.gridMajor, palette.gridMinor);
  grid.material.transparent = true;
  grid.material.opacity = 0.72;
  scene.add(grid);
}
rebuildGrid();

const originMat = new THREE.MeshBasicMaterial({ color: palette.origin });
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), originMat));

function drawLabelCanvas(canvas, text, colorHex) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = colorHex;
  ctx.font = 'italic 600 58px -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 64);
}

function makeLabel(text, colorHex, position) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  drawLabelCanvas(canvas, text, colorHex);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
  sprite.scale.set(0.45, 0.45, 1);
  sprite.position.set(...position);
  sprite.userData = { text, canvas, texture };
  scene.add(sprite);
  return sprite;
}

const axisLabels = {
  x: makeLabel('x', hexStr(palette.x), [AXIS_LEN + 0.42, 0, 0]),
  y: makeLabel('y', hexStr(palette.y), [0, AXIS_LEN + 0.42, 0]),
  z: makeLabel('z', hexStr(palette.z), [0, 0, AXIS_LEN + 0.42])
};

function makeDashedVector(color, opacity) {
  const g = new THREE.Group();
  const lineMat = new THREE.LineDashedMaterial({
    color,
    dashSize: 0.18,
    gapSize: 0.1,
    transparent: true,
    opacity
  });
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(1, 0, 0)]),
    lineMat
  );
  line.computeLineDistances();
  const tipMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity });
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), tipMat);
  g.add(line, tip);
  g.userData = { dashed: true, line, tip, materials: [lineMat, tipMat] };
  return g;
}

function makeSolidVector(color, opacity, shaftRadius, headRadius, baseHeadLen) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.55,
    metalness: 0.06,
    transparent: opacity < 1,
    opacity
  });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius, shaftRadius, 1, 16), mat);
  const head = new THREE.Mesh(new THREE.ConeGeometry(headRadius, 1, 20), mat);
  g.add(shaft, head);
  g.userData = { dashed: false, shaft, head, baseHeadLen, materials: [mat] };
  return g;
}

function updateVector(g, vec) {
  const len = vec.length();
  if (len < 0.001) {
    g.visible = false;
    return;
  }
  g.visible = true;
  if (g.userData.dashed) {
    const pos = g.userData.line.geometry.attributes.position;
    pos.setXYZ(1, vec.x, vec.y, vec.z);
    pos.needsUpdate = true;
    g.userData.line.geometry.computeBoundingSphere();
    g.userData.line.computeLineDistances();
    g.userData.tip.position.copy(vec);
    return;
  }
  const { shaft, head, baseHeadLen } = g.userData;
  const headLen = Math.min(baseHeadLen, len * 0.35);
  const headScale = headLen / baseHeadLen;
  const shaftLen = Math.max(0, len - headLen);
  shaft.visible = shaftLen > 0.0005;
  if (shaft.visible) {
    shaft.scale.set(headScale, shaftLen, headScale);
    shaft.position.set(0, shaftLen * 0.5, 0);
  }
  head.scale.set(headScale, headLen, headScale);
  head.position.set(0, shaftLen + headLen * 0.5, 0);
  orientAlong(g, vec.clone().normalize());
}

const origVec = makeDashedVector(palette.v0, 0.65);
const stepVecs = [
  makeSolidVector(palette.x, 0.62, 0.022, 0.065, 0.18),
  makeSolidVector(palette.y, 0.62, 0.022, 0.065, 0.18)
];
const finalVec = makeSolidVector(palette.vf, 1.0, 0.036, 0.095, 0.26);
scene.add(origVec, stepVecs[0], stepVecs[1], finalVec);

function makeRotationArc(color) {
  const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 });
  const line = new THREE.Line(new THREE.BufferGeometry(), lineMat);
  const sectorMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.09,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const sector = new THREE.Mesh(new THREE.BufferGeometry(), sectorMat);
  scene.add(line, sector);
  return { line, sector, materials: [lineMat, sectorMat] };
}

const arcs = [
  makeRotationArc(palette.x),
  makeRotationArc(palette.y),
  makeRotationArc(palette.z)
];

function updateArc(arc, axisKey, v0, deg, visible) {
  const axisVec = AX[axisKey];
  const center = axisVec.clone().multiplyScalar(v0.dot(axisVec));
  const radius = v0.distanceTo(center);
  const show = visible && Math.abs(deg) > 0.01 && radius > 0.005;
  arc.line.visible = show;
  arc.sector.visible = show;
  if (!show) return;

  const n = Math.max(12, Math.ceil(Math.abs(deg) / 2));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    pts.push(v0.clone().applyAxisAngle(axisVec, (deg * DEG2RAD * i) / n));
  }
  arc.line.geometry.dispose();
  arc.line.geometry = new THREE.BufferGeometry().setFromPoints(pts);

  const verts = new Float32Array(n * 9);
  for (let i = 0; i < n; i++) {
    const a = pts[i];
    const b = pts[i + 1];
    const o = i * 9;
    verts[o] = center.x;     verts[o + 1] = center.y;     verts[o + 2] = center.z;
    verts[o + 3] = a.x;      verts[o + 4] = a.y;          verts[o + 5] = a.z;
    verts[o + 6] = b.x;      verts[o + 7] = b.y;          verts[o + 8] = b.z;
  }
  arc.sector.geometry.dispose();
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  arc.sector.geometry = sGeo;
}

// Zero-GC animation trail
const MAX_TRAIL = 600;
const trailBuf = new Float32Array(MAX_TRAIL * 3);
let trailCount = 0;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailBuf, 3));
trailGeo.setDrawRange(0, 0);
const trailMat = new THREE.LineBasicMaterial({ color: palette.vf, transparent: true, opacity: 0.28 });
const trailLine = new THREE.Line(trailGeo, trailMat);
trailLine.frustumCulled = false;
scene.add(trailLine);

function pushTrailPoint(p) {
  if (trailCount < MAX_TRAIL) {
    const o = trailCount * 3;
    trailBuf[o] = p.x;
    trailBuf[o + 1] = p.y;
    trailBuf[o + 2] = p.z;
    trailCount++;
  } else {
    trailBuf.copyWithin(0, 3);
    const o = (MAX_TRAIL - 1) * 3;
    trailBuf[o] = p.x;
    trailBuf[o + 1] = p.y;
    trailBuf[o + 2] = p.z;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.setDrawRange(0, trailCount);
}

function clearTrail() {
  trailCount = 0;
  trailGeo.setDrawRange(0, 0);
}

function setGroupColor(g, hex) {
  g.userData.materials.forEach((m) => m.color.setHex(hex));
}

function applyThemeToScene(isDark) {
  palette = isDark ? PALETTES.dark : PALETTES.light;
  scene.background.setHex(palette.bg);
  scene.fog.color.setHex(palette.bg);
  rebuildGrid();
  originMat.color.setHex(palette.origin);
  setGroupColor(axisGroups.x, palette.x);
  setGroupColor(axisGroups.y, palette.y);
  setGroupColor(axisGroups.z, palette.z);
  ['x', 'y', 'z'].forEach((k) => {
    const spr = axisLabels[k];
    drawLabelCanvas(spr.userData.canvas, spr.userData.text, hexStr(palette[k]));
    spr.userData.texture.needsUpdate = true;
  });
  setGroupColor(origVec, palette.v0);
  setGroupColor(stepVecs[0], palette.x);
  setGroupColor(stepVecs[1], palette.y);
  setGroupColor(finalVec, palette.vf);
  arcs[0].materials.forEach((m) => m.color.setHex(palette.x));
  arcs[1].materials.forEach((m) => m.color.setHex(palette.y));
  arcs[2].materials.forEach((m) => m.color.setHex(palette.z));
  trailMat.color.setHex(palette.vf);
}

// ── UI & State Controller ────────────────────────────────────────────────────
const state = {
  vx: 2,
  vy: 1,
  vz: 1,
  ax: 30,
  ay: 45,
  az: 60,
  matrixMode: 'symbolic',
  showSteps: true,
  animating: false
};

const ANG_IDS = ['ax', 'ay', 'az'];
const stepsEl = document.getElementById('steps');
const matricesEl = document.getElementById('matrices');
const animBtn = document.getElementById('animateBtn');
const legendV1 = document.getElementById('legend-v1');
const legendV2 = document.getElementById('legend-v2');

function updateSliderFill(id, val) {
  const slider = document.getElementById(id);
  const row = slider.closest('.ang-row');
  const pct = ((val + 180) / 360) * 100;
  row.style.setProperty('--fill-start', `${Math.min(50, pct).toFixed(2)}%`);
  row.style.setProperty('--fill-end', `${Math.max(50, pct).toFixed(2)}%`);
}

function setAngleUI(id, val, roundReadout = false) {
  state[id] = val;
  document.getElementById(id).value = val;
  document.getElementById(id + 'v').textContent = roundReadout ? `${Math.round(val)}°` : fmtDeg(val);
  updateSliderFill(id, val);
}

function renderSteps(vs) {
  const f = (v) => `(${fmtCoord(v.x)}, ${fmtCoord(v.y)}, ${fmtCoord(v.z)})`;
  const rows = [
    ['v<sub>0</sub>', vs[0]],
    ['v<sub>1</sub> = R<sub>x</sub>v<sub>0</sub>', vs[1]],
    ['v<sub>2</sub> = R<sub>y</sub>v<sub>1</sub>', vs[2]],
    ['v′ = R<sub>z</sub>v<sub>2</sub>', vs[3]]
  ];
  stepsEl.innerHTML = rows
    .map(
      ([expr, vec], i) =>
        `<div class="step-row${i === 3 ? ' final' : ''}"><span class="step-expr">${expr}</span><span class="step-val">${f(vec)}</span></div>`
    )
    .join('');
}

function renderMatrices(R) {
  const axisColors = { X: 'var(--x)', Y: 'var(--y)', Z: 'var(--z)' };
  const ang = { X: state.ax, Y: state.ay, Z: state.az };
  const isSymbolic = state.matrixMode === 'symbolic';

  const makeBlock = (name, dotColor, rightText, cells, gridMode) => {
    const b = document.createElement('div');
    b.className = 'matrix-block';
    b.innerHTML = `
      <div class="matrix-head">
        <span class="matrix-name"><i class="matrix-dot" style="background:${dotColor}"></i><span>${name}</span></span>
        ${rightText ? `<span class="matrix-angle">${rightText}</span>` : ''}
      </div>
      <div class="matbox">
        <div class="bracket l"></div>
        <div class="matgrid ${gridMode}">${cells.map((v) => `<span>${v}</span>`).join('')}</div>
        <div class="bracket r"></div>
      </div>
    `;
    return b;
  };

  matricesEl.innerHTML = '';
  ['Z', 'Y', 'X'].forEach((a) => {
    const k = a.toLowerCase();
    matricesEl.appendChild(
      makeBlock(
        `R<sub>${k}</sub>`,
        axisColors[a],
        fmtDeg(ang[a]),
        matrixCells(a, ang[a], isSymbolic),
        isSymbolic ? 'symbolic' : 'numeric'
      )
    );
  });

  const e = R.elements;
  const compCells = [];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      compCells.push(fmtNum(e[c * 3 + r]));
    }
  }
  matricesEl.appendChild(
    makeBlock('R = R<sub>z</sub>R<sub>y</sub>R<sub>x</sub>', 'var(--vf)', '', compCells, 'numeric')
  );
}

function update() {
  const { vs, R } = compute(state);
  updateVector(origVec, vs[0]);
  updateVector(finalVec, vs[3]);
  updateVector(stepVecs[0], vs[1]);
  updateVector(stepVecs[1], vs[2]);

  stepVecs[0].visible = stepVecs[0].visible && state.showSteps && Math.abs(state.ax) > 0.01;
  stepVecs[1].visible = stepVecs[1].visible && state.showSteps && Math.abs(state.ay) > 0.01;

  updateArc(arcs[0], 'X', vs[0], state.ax, state.showSteps);
  updateArc(arcs[1], 'Y', vs[1], state.ay, state.showSteps);
  updateArc(arcs[2], 'Z', vs[2], state.az, state.showSteps);

  legendV1.classList.toggle('hidden', !state.showSteps);
  legendV2.classList.toggle('hidden', !state.showSteps);

  renderSteps(vs);
  renderMatrices(R);
  return { vs, R };
}

['vx', 'vy', 'vz'].forEach((id) => {
  const input = document.getElementById(id);
  input.addEventListener('input', () => {
    const parsed = parseFloat(input.value);
    state[id] = Number.isFinite(parsed) ? parsed : 0;
    update();
  });
});

let anim = null;
function stopAnim() {
  state.animating = false;
  anim = null;
  animBtn.textContent = '播放序列';
  animBtn.classList.remove('active');
}

ANG_IDS.forEach((id) => {
  const slider = document.getElementById(id);
  const valEl = document.getElementById(id + 'v');
  updateSliderFill(id, state[id]);

  slider.addEventListener('input', () => {
    if (state.animating) stopAnim();
    setAngleUI(id, parseFloat(slider.value));
    update();
  });

  const openEditor = () => {
    if (valEl.querySelector('input')) return;
    if (state.animating) stopAnim();
    const prev = state[id];
    const input = document.createElement('input');
    input.type = 'number';
    input.step = 'any';
    input.min = '-180';
    input.max = '180';
    input.value = String(prev);
    valEl.textContent = '';
    valEl.appendChild(input);
    input.focus();
    input.select();

    let done = false;
    const finish = (commit) => {
      if (done) return;
      done = true;
      let n = prev;
      if (commit) {
        const parsed = parseFloat(input.value);
        if (Number.isFinite(parsed)) {
          n = Math.max(-180, Math.min(180, parsed));
        }
      }
      setAngleUI(id, n);
      update();
    };

    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        finish(true);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        finish(false);
      }
    });
  };

  valEl.addEventListener('click', openEditor);
  valEl.addEventListener('keydown', (e) => {
    if (e.target !== valEl) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openEditor();
    }
  });
});

document.querySelectorAll('#matModeSeg button').forEach((btn) => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#matModeSeg button').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.matrixMode = btn.dataset.mode;
    update();
  });
});

document.getElementById('showSteps').addEventListener('change', (e) => {
  state.showSteps = e.target.checked;
  update();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  stopAnim();
  ANG_IDS.forEach((id) => setAngleUI(id, 0));
  clearTrail();
  update();
});

animBtn.addEventListener('click', () => {
  if (state.animating) {
    ANG_IDS.forEach((id, i) => setAngleUI(id, anim.t[i]));
    stopAnim();
    update();
    return;
  }
  const targets = [state.ax, state.ay, state.az];
  if (targets.every((a) => Math.abs(a) < 1e-6)) return;
  anim = { t: targets, phase: 0 };
  state.animating = true;
  animBtn.textContent = '停止';
  animBtn.classList.add('active');
  ANG_IDS.forEach((id) => setAngleUI(id, 0, true));
  clearTrail();
  const res = update();
  pushTrailPoint(res.vs[3]);
});

function animateStep(dt) {
  if (!state.animating || !anim) return;
  while (anim.phase < 3 && state[ANG_IDS[anim.phase]] === anim.t[anim.phase]) {
    anim.phase++;
  }
  if (anim.phase >= 3) {
    stopAnim();
    return;
  }
  const id = ANG_IDS[anim.phase];
  const target = anim.t[anim.phase];
  const remain = target - state[id];
  const step = 60 * dt;
  const nextVal = Math.abs(remain) <= step ? target : state[id] + Math.sign(remain) * step;
  setAngleUI(id, nextVal, true);
  if (nextVal === target) {
    setAngleUI(id, target);
    anim.phase++;
    while (anim.phase < 3 && state[ANG_IDS[anim.phase]] === anim.t[anim.phase]) {
      anim.phase++;
    }
  }
  const res = update();
  pushTrailPoint(res.vs[3]);
  if (anim.phase >= 3) {
    stopAnim();
  }
}

if (darkMql.addEventListener) {
  darkMql.addEventListener('change', (e) => {
    applyThemeToScene(e.matches);
  });
}

let lastTime = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  animateStep(dt);
  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  const w = host.clientWidth;
  const h = host.clientHeight;
  if (!w || !h) return;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

new ResizeObserver(resize).observe(host);
resize();
update();
loop();
</script>
</body>
